# Databricks App runtime configuration (PLT-00, ARC-01).
# The app must bind 0.0.0.0:$DATABRICKS_APP_PORT; pim.serve reads that variable [D5].
command: ["python", "-m", "pim.serve"]
env:
  - name: PYTHONPATH
    value: "backend"
  - name: PIM_ENV
    value: "databricks"
  - name: PIM_ROLE_SOURCE
    # "groups" maps Entra/Databricks groups to roles via the OBO token (RBAC-01, preferred).
    # "table" uses the in-app user_role table keyed by X-Forwarded-Email (fallback).
    value: "table"
  - name: PIM_LAKEBASE_INSTANCE
    valueFrom: lakebase
  - name: PIM_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: PIM_IMPORT_VOLUME
    value: "/Volumes/swim_data_whse/pim/imports"
  - name: PIM_PACKAGE_VOLUME
    value: "/Volumes/swim_data_whse/pim/packages"
  - name: PIM_STYLE_MASTER_TABLE
    value: "swim_data_whse.image_relay_view.vw_image_relay_export_style_master"
  - name: PIM_AIR_API_KEY
    valueFrom: air-api-key
  - name: PIM_SHOPIFY_READ_TOKEN
    valueFrom: shopify-read-token
  - name: PIM_SHOPIFY_STORE_DOMAIN
    value: "vitamin-a.myshopify.com"
  # Job ids injected from the job resources so the app can enqueue runs (ARC-04)
  - name: DATABRICKS_JOB_ID_INGEST
    valueFrom: ingest-job
  - name: DATABRICKS_JOB_ID_AIR_POLL
    valueFrom: air-poll-job
  - name: DATABRICKS_JOB_ID_PACKAGE
    valueFrom: package-job
  - name: DATABRICKS_JOB_ID_HISTORY
    valueFrom: history-job
  - name: DATABRICKS_JOB_ID_IMPORT_COMMIT
    valueFrom: import-commit-job
  - name: DATABRICKS_JOB_ID_BULK
    valueFrom: bulk-job
  - name: DATABRICKS_JOB_ID_RULES
    valueFrom: rules-job
  - name: DATABRICKS_JOB_ID_CHANNEL_EXPORT
    valueFrom: channel-export-job
  - name: DATABRICKS_JOB_ID_RENDITIONS
    valueFrom: renditions-job
  - name: DATABRICKS_JOB_ID_AI_BULK
    valueFrom: ai-bulk-job
  - name: DATABRICKS_JOB_ID_AI_EVAL
    valueFrom: ai-eval-job
  - name: DATABRICKS_JOB_ID_QUALITY
    valueFrom: quality-job
  # AI-01: model per task from config; Unity Gateway endpoints with usage tracking and inference tables (D19).
  - name: PIM_AI_ENDPOINT_COPY
    value: "databricks-claude-sonnet-4-5"
  - name: PIM_AI_ENDPOINT_CLASSIFY
    value: "databricks-claude-haiku-4-5"
  # AI-07: set to an MLflow experiment path to log evaluation runs there as well (D29).
  - name: PIM_MLFLOW_EXPERIMENT
    value: ""
  # EXP-08 Walmart Marketplace credentials (GOV-05); the feed is built and validated without them, sent only with
  # PIM_FEATURE_CHANNEL_SEND=true
  - name: PIM_WALMART_CLIENT_ID
    valueFrom: walmart-client-id
  - name: PIM_WALMART_CLIENT_SECRET
    valueFrom: walmart-client-secret
  # D-03: the Shopify write path runs only against this development store until direct writes are approved
  - name: PIM_SHOPIFY_SANDBOX_DOMAIN
    value: ""
  - name: PIM_SHOPIFY_SANDBOX_TOKEN
    valueFrom: shopify-sandbox-token
  # EXP-09 email delivery (optional); SFTP passwords or keys are app secret resources named on the channel transport
  - name: PIM_SMTP_HOST
    value: ""
  - name: PIM_SMTP_FROM
    value: "pim@swimusa.com"
  - name: PIM_FEATURE_IMAGE_AI_MATCH
    # IMG-03 tier 3 (Air semantic search plus vision model) stays off until PLT-00 step 8 passes.
    value: "false"
  - name: PIM_FEATURE_AI_MAPPING_SUGGEST
    value: "false"  # IMP-02: classify-endpoint suggestions for unmatched import columns (Phase 6)
  - name: PIM_HISTORY_HOT_YEARS
    value: "2"  # GOV-02: history older than this leaves Lakebase after the Delta merge (Phase 6)
  - name: PIM_APP_BASE_URL
    value: ""  # DM-07/DM-09: app URL used in digest email links (Phase 6)
  - name: PIM_FEATURE_CHANNEL_SEND
    # EXP-05: retailer API sends stay off until Phase 5 credentials and sandbox tests exist; publishes still
    # validate, write the payload and (for Shopify) build the EXP-13 package.
    value: "false"
  - name: PIM_FEATURE_SHOPIFY_DIRECT_WRITE
    # EXP-07 stays off until the owner approves direct writes (EXP-13 is the Phase 1 path).
    value: "false"
