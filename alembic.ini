# Alembic configuration for Lakebase schema upgrades (ARC-02). The URL comes from PIM_DATABASE_URL or the
# bound Lakebase resource at runtime (see migrations/env.py); the value here is a placeholder.
[alembic]
script_location = migrations
prepend_sys_path = backend
sqlalchemy.url = postgresql+psycopg://pim@localhost:5499/pim

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
