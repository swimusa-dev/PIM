# Families (1.3): which attribute groups apply to a product type. erp_match assigns a family from ERP fields on ingest.
# The Image Relay view has no product type column. Its Body Type column says what a style is (271 values such as
# "MISSY SEPARATE TOP TANKINI", "COVER UP DRESS", "DNU - 1 PIECE"), so each rule reads body_type, then product_type for
# a source that has one. A rule matches on `in` (exact), `eq`, `contains` or `regex_any` (case-insensitive patterns on the
# upper-cased value). The first family in `priority` order (lower first) that matches wins, so the more specific
# families come first: cover-ups before swimdresses ("1 PC SWIMDRESS" is a one-piece, "COVER UP DRESS" is not), sets before
# tops ("2 PC KIDS TANKINI SET" is a set), apparel tops before swim tops. Anything that matches nothing (NO DESC, NOT
# REQUIRED, ranges, accessories, men's) stays unassigned.
families:
  - code: cover_up
    label: Cover-Up
    erp_match:
      fields: [body_type, product_type]
      priority: 10
      in: [COVER UP, COVER-UP, SARONG, DRESS, PANT, SKIRT]
      regex_any:
        - 'COVER ?-?UP'
        - 'SARONG'
        - 'PAREO'
        - 'CAFTAN'
        - '\bTUNIC\b'
        - '\bROBE\b'
        - 'BEACH (SHIRT|PANT)'
        - '\bDRESS\b'
        - '\bROMPER\b'
        - 'JUMP ?SUIT'
        - '\bPANT\b'
        - '\bSKIRT\b'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_walmart, channel_targetplus, channel_nordstrom]
  - code: swim_set
    label: Swim Set
    erp_match:
      fields: [body_type, product_type]
      priority: 15
      regex_any:
        - '\b[23] ?PC\b'
        - '\bSET\b'
        - '\b2 PIECE\b'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_walmart, channel_targetplus, channel_nordstrom]
  - code: one_piece
    label: One-Piece
    erp_match:
      fields: [body_type, product_type]
      priority: 20
      in: [ONE PIECE, ONE-PIECE, MAILLOT]
      regex_any:
        - '\b1 ?PC\b'
        - '\b1PC\b'
        - '1 PIECE'
        - 'ONE[ -]PIECE'
        - 'MAILLOT'
        - 'SWIMDRESS'
        - 'UNISUIT'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_walmart, channel_targetplus, channel_nordstrom]
  - code: apparel
    label: Apparel
    erp_match:
      fields: [body_type, product_type]
      priority: 30
      in: [KNIT, SWEATER, TEE, APPAREL]
      regex_any:
        - 'SWEATER'
        - 'SWEATSHIRT'
        - '\bTEE\b'
        - '(?<!TOP )\bSHIRT\b'
        - '\bSHORTS\b'
        - 'LEGGINGS'
        - 'JEANS'
        - '\bTOP - '
        - 'SHAPING'
        - 'THIGH SHAPER'
        - 'WAIST CINCHER'
        - 'SLIMMING'
        - 'TORSETTE'
        - '\bKNIT\b'
        - 'APPAREL'
        - 'LONG PANT|ANKLE PANT|CROP PANT'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_nordstrom]
  - code: swim_top
    label: Swim Top
    erp_match:
      fields: [body_type, product_type]
      priority: 40
      in: [TOP, BRALETTE, BANDEAU, TRIANGLE TOP]
      regex_any:
        - 'RASHGUARD'
        - 'TANKINI'
        - 'HANKINI'
        - 'BIKINI TOP'
        - 'BIKINI BRA'
        - '\bBRA\b'
        - 'BRALETTE'
        - 'BANDEAU'
        - 'TRIANGLE'
        - 'HALTER'
        - 'MIDKINI'
        - 'CONVERTIBLE'
        - '\bTOPS?\b'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_walmart, channel_targetplus, channel_nordstrom]
  - code: swim_bottom
    label: Swim Bottom
    erp_match:
      fields: [body_type, product_type]
      priority: 50
      in: [BOTTOM, HIPSTER, HIGH WAIST]
      regex_any:
        - 'BOTTOMS?\b'
        - 'HIPSTER'
        - 'HIGH ?-?WAIST'
        - 'HI WAIST'
        - 'HIGH LEG'
        - '(LOW|HIGH) RISE'
        - 'SKIRTED'
        - 'SKIRTINI'
        - '\bBRIEF\b'
        - '\bSHORT\b'
        - 'WATERSHORT'
        - 'FLOUNCE'
        - 'TIE SIDE'
    groups: [erp, style_details, design_tech, merch, seo, copy, channel_shopify, channel_walmart, channel_targetplus, channel_nordstrom]
  - code: unassigned
    label: Unassigned
    erp_match: {}
    groups: [erp, style_details, merch, copy]
