      - {code: L, label: L, sort_order: 50, channel_mappings: {walmart-mp: L, targetplus: L, nordstrom: L}}
      - {code: XL, label: XL, sort_order: 60, channel_mappings: {walmart-mp: XL, targetplus: XL, nordstrom: XL}}
      - {code: XXL, label: XXL, sort_order: 70, channel_mappings: {walmart-mp: XXL, targetplus: XXL, nordstrom: XXL}}
