# Declarative Automation Bundle (formerly Databricks Asset Bundles) for the PIM app [D26].
# Deploy:  databricks bundle validate -t dev && databricks bundle deploy -t dev && databricks bundle run pim_app -t dev
bundle:
  name: swimusa-pim

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the PIM schema and volumes
    default: swim_data_whse
  schema:
    description: Schema for PIM Delta tables and volumes
    default: pim
  lakebase_instance:
    description: Name of the Lakebase (managed Postgres) instance
    default: pim-lakebase
  sql_warehouse_id:
    description: SQL warehouse used for Delta reads (Style Master ingest, history publish)
    default: 02726a0a46ad773a
  secret_scope:
    description: Secret scope holding adapter credentials (GOV-05)
    default: pim-secrets
  app_compute_size:
    description: Databricks App compute size (MEDIUM or LARGE); PLT-00 step 1 confirms LARGE on our workspace
    default: MEDIUM

sync:
  # The built frontend is gitignored; bundle sync honors .gitignore, so include it explicitly or the app
  # starts with the "Frontend build missing" page.
  include:
    - backend/pim/static/**
  exclude:
    - .venv
    - frontend/node_modules
    - frontend/src
    - tests
    - .pytest_cache
    - .ruff_cache
    - local_data

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-4067540067618844.4.azuredatabricks.net
    variables:
      lakebase_user: david-admin@swimusa.com
  prod:
    mode: production
    workspace:
      host: https://adb-4067540067618844.4.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: REPLACE-WITH-SP-APPLICATION-ID
