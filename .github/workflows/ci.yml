name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pim
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pim_test
        ports: ["5499:5432"]
        options: >-
          --health-cmd "pg_isready -U pim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check backend tests
      - run: pytest -q
        env:
          PIM_TEST_DATABASE_URL: postgresql+psycopg://pim@localhost:5499/pim_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
